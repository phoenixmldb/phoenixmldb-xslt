name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Resolve and guard version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then echo "::error::No <Version> in Directory.Build.props"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != v$VERSION (Directory.Build.props). Align them before releasing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (ref ${GITHUB_REF_NAME}, type ${GITHUB_REF_TYPE})"

      - name: Engine pins are not stale
        run: ./scripts/check-pins.sh

      - name: Restore
        run: |
          dotnet restore src/PhoenixmlDb.Xslt
          dotnet restore src/PhoenixmlDb.Xslt.Cli

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build src/PhoenixmlDb.Xslt -c Release --no-restore -p:Version="$BUILD_VERSION"
          dotnet build src/PhoenixmlDb.Xslt.Cli -c Release --no-restore -p:Version="$BUILD_VERSION"

      - name: Extract release notes for this version
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v v="## $VER " 'index($0,v)==1{grab=1;next} grab&&/^## /{exit} grab{print}' RELEASES.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::No RELEASES.md section for $VER"; exit 1
          fi
          # MSBuild's -p:/-property: switch parser splits values on unescaped
          # ';' AND ',' (both act as property/item-list separators) and treats
          # '%' as its escape lead-in; a literal '"' is silently stripped
          # (not an error, just data loss). Escape all four so the notes
          # survive as one -p:PackageReleaseNotes value; MSBuild un-escapes
          # them back in the nuspec. '%' MUST be escaped FIRST so its own
          # escape sequences aren't double-escaped. The value is delivered to
          # pack via env: below, NEVER spliced into the shell, so backticks in
          # the notes are inert (avoids GitHub expression-splicing injection).
          NOTES=${NOTES//%/%25}
          NOTES=${NOTES//;/%3B}
          NOTES=${NOTES//,/%2C}
          NOTES=${NOTES//\"/%22}
          { echo "notes<<__RELNOTES_EOF__"; printf '%s\n' "$NOTES"; echo "__RELNOTES_EOF__"; } >> "$GITHUB_OUTPUT"

      - name: Engine pins match this release train
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-release-train.sh "${{ steps.version.outputs.version }}"

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          for proj in src/PhoenixmlDb.Xslt src/PhoenixmlDb.Xslt.Cli; do
            dotnet pack "$proj" -c Release --no-build \
              -p:PackageVersion="$PKG_VERSION" \
              -p:PackageReleaseNotes="$PKG_NOTES" \
              -o ./artifacts
          done

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # Gates the release. `publish` needs this job, so a red suite stops a tag reaching
  # nuget.org.
  #
  # This reverses 1e62e88's reversal, and the earlier reasoning deserves recording rather
  # than deleting: the gate was removed because a flaky or environment-specific failure
  # blocks shipping a package that is otherwise fine, and the recovery is to retag. That
  # cost is real. It is simply smaller than the alternative.
  #
  # What the ungated arrangement actually bought was 16 published versions in the 1.6.x
  # line, several carrying defects found later — fn:sum returning 0 for any xs:integer
  # cast from text, and storage-backed nodes atomizing to "" — both of which shipped and
  # sat in released packages. Once a package is public the only remedies are unlist or a
  # follow-up version, and both cost consumers more than a blocked tag costs us.
  #
  # If a flaky test blocks a release, fix or quarantine the test. That is a worse day than
  # retagging and a much better one than a recall.
  #
  # Conformance (W3C XSLT 3.0 / QT3) is not run here either: it needs a ~470 MB suite
  # checkout and takes ~9 min per TFM. It lives in conformance.yml.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Test
        run: |
          dotnet test tests/PhoenixmlDb.Xslt.Tests -c Release
          dotnet test tests/PhoenixmlDb.Xslt.LanguageServer.Tests -c Release

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Login to NuGet via trusted publisher
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: endpointsystems

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
