name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Build/test against the sibling engines' SOURCE on every PR and push (scripts/clone-siblings.sh
  # puts them next to this checkout; Directory.Build.targets swaps the package references for them).
  # Only the release train, a v* tag, builds against the pinned packages it will ship with.
  PHOENIXML_DEV: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sibling engines from source
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: ./scripts/clone-siblings.sh phoenixmldb-core phoenixmldb-xquery

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Resolve and guard version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then echo "::error::No <Version> in Directory.Build.props"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != v$VERSION (Directory.Build.props). Align them before releasing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (ref ${GITHUB_REF_NAME}, type ${GITHUB_REF_TYPE})"

      # Pins matter only to the release train: between releases the build uses the siblings' source.
      - name: Engine pins are not stale
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-pins.sh

      - name: Restore
        run: |
          dotnet restore src/PhoenixmlDb.Xslt
          dotnet restore src/PhoenixmlDb.Xslt.Cli

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build src/PhoenixmlDb.Xslt -c Release --no-restore -p:Version="$BUILD_VERSION"
          dotnet build src/PhoenixmlDb.Xslt.Cli -c Release --no-restore -p:Version="$BUILD_VERSION"

      - name: Extract release notes for this version
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v v="## $VER " 'index($0,v)==1{grab=1;next} grab&&/^## /{exit} grab{print}' RELEASES.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::No RELEASES.md section for $VER"; exit 1
          fi
          # MSBuild's -p:/-property: switch parser splits values on unescaped
          # ';' AND ',' (both act as property/item-list separators) and treats
          # '%' as its escape lead-in; a literal '"' is silently stripped
          # (not an error, just data loss). Escape all four so the notes
          # survive as one -p:PackageReleaseNotes value; MSBuild un-escapes
          # them back in the nuspec. '%' MUST be escaped FIRST so its own
          # escape sequences aren't double-escaped. The value is delivered to
          # pack via env: below, NEVER spliced into the shell, so backticks in
          # the notes are inert (avoids GitHub expression-splicing injection).
          NOTES=${NOTES//%/%25}
          NOTES=${NOTES//;/%3B}
          NOTES=${NOTES//,/%2C}
          NOTES=${NOTES//\"/%22}
          { echo "notes<<__RELNOTES_EOF__"; printf '%s\n' "$NOTES"; echo "__RELNOTES_EOF__"; } >> "$GITHUB_OUTPUT"

      - name: Engine pins match this release train
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-release-train.sh "${{ steps.version.outputs.version }}"

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          for proj in src/PhoenixmlDb.Xslt src/PhoenixmlDb.Xslt.Cli; do
            dotnet pack "$proj" -c Release --no-build \
              -p:PackageVersion="$PKG_VERSION" \
              -p:PackageReleaseNotes="$PKG_NOTES" \
              -o ./artifacts
          done

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # Gates the release. `publish` needs this job, so a red suite stops a tag reaching
  # nuget.org.
  #
  # This reverses 1e62e88's reversal, and the earlier reasoning deserves recording rather
  # than deleting: the gate was removed because a flaky or environment-specific failure
  # blocks shipping a package that is otherwise fine, and the recovery is to retag. That
  # cost is real. It is simply smaller than the alternative.
  #
  # What the ungated arrangement actually bought was 16 published versions in the 1.6.x
  # line, several carrying defects found later — fn:sum returning 0 for any xs:integer
  # cast from text, and storage-backed nodes atomizing to "" — both of which shipped and
  # sat in released packages. Once a package is public the only remedies are unlist or a
  # follow-up version, and both cost consumers more than a blocked tag costs us.
  #
  # If a flaky test blocks a release, fix or quarantine the test. That is a worse day than
  # retagging and a much better one than a recall.
  #
  # Conformance (W3C XSLT 3.0 / QT3) is not run here either: it needs a ~470 MB suite
  # checkout and takes ~9 min per TFM. It lives in conformance.yml.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sibling engines from source
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: ./scripts/clone-siblings.sh phoenixmldb-core phoenixmldb-xquery

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Test
        run: |
          dotnet test tests/PhoenixmlDb.Xslt.Tests -c Release
          dotnet test tests/PhoenixmlDb.Xslt.LanguageServer.Tests -c Release

  # Windows. Every other job here is ubuntu-latest, and we ship a Windows CLI: until this job
  # existed, Windows-only defects reached us only through Martin Honnen. #179 is the example.
  # The CLI wrote stdout in the console's legacy code page, which corrupted non-ASCII
  # transformation output on redirect. .NET on Unix always writes UTF-8, so no Linux job
  # could ever see it.
  #
  # A `publish` dependency: a red Windows run stops a tag reaching nuget.org, the same as Linux.
  # Made so once the first measurement was clean and its one finding (#197) was fixed.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sibling engines from source
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: ./scripts/clone-siblings.sh phoenixmldb-core phoenixmldb-xquery

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Test
        run: |
          dotnet test tests/PhoenixmlDb.Xslt.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/PhoenixmlDb.Xslt.LanguageServer.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # #179 on the platform where it happens. Redirect through cmd, not PowerShell:
      # PowerShell's `>` decodes and re-encodes the child's output, which would hide the raw
      # bytes this is checking.
      #
      # The published pre-fix 2.2.0 runs alongside as a control. If it ALSO writes UTF-8 on
      # this runner, the runner's default code page masks the bug, and a pass here would prove
      # nothing. The step says so instead of passing quietly: a check that cannot fail is
      # worse than none (BUGS #107).
      - name: CLI writes UTF-8 on Windows (#179)
        run: |
          dotnet build src/PhoenixmlDb.Xslt.Cli -c Release -f net10.0 --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $d = Join-Path $env:RUNNER_TEMP enc; New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content -Encoding utf8NoBOM "$d\t.xsl" '<xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0"><xsl:output method="text"/><xsl:template match="/">Stra&#223;en &#8594; ok</xsl:template></xsl:stylesheet>'
          Set-Content -Encoding utf8NoBOM "$d\in.xml" '<in/>'
          $want = [byte[]](0x53,0x74,0x72,0x61,0xC3,0x9F,0x65,0x6E,0x20,0xE2,0x86,0x92,0x20,0x6F,0x6B)
          function Bytes($exe, $out) {
            # chcp 1252 gives the console the legacy code page Martin's PowerShell has. The runner's
            # default is already UTF-8, and the first run of this check showed the pre-fix build
            # "passing" under it: the check could not tell fixed from broken.
            cmd /c "chcp 1252 >NUL & `"$exe`" `"$d\t.xsl`" `"$d\in.xml`" < NUL > `"$out`" 2> `"$out.err`""
            $b = [IO.File]::ReadAllBytes($out)
            ($b | Select-Object -First $want.Length | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          }
          $wantHex = ($want | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          $cand = Bytes "src\PhoenixmlDb.Xslt.Cli\bin\Release\net10.0\xslt.exe" "$d\cand.txt"
          dotnet tool install --tool-path "$d\old" xslt --version 2.2.0 | Out-Null
          $old  = Bytes "$d\old\xslt.exe" "$d\old.txt"
          Write-Host "expected (UTF-8): $wantHex"
          Write-Host "candidate:        $cand"
          Write-Host "2.2.0 (pre-fix):  $old"
          if ($cand -ne $wantHex) { Write-Host "::error::CLI output is not UTF-8 on Windows (#179)"; exit 1 }
          if ($old -eq $wantHex) {
            Write-Host "::error::The pre-fix 2.2.0 also wrote UTF-8 even under chcp 1252, so this check cannot tell fixed from broken. Fix the check before trusting it."; exit 1
          } else {
            Write-Host "Discriminating: the pre-fix CLI produced different bytes on this runner, so the pass means the fix works."
          }

  publish:
    needs: [build, test, test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Login to NuGet via trusted publisher
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: endpointsystems

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
