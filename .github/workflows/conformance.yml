name: Conformance

# Split out from ci.yml on cost, not importance. The W3C XSLT suite is ~470 MB and a
# full sweep is too slow to sit in front of every push. ci.yml keeps the fast suites and
# is what gates the NuGet publish; this workflow is the deeper, slower check.
#
# NOTE: running on a tag records conformance for that release but does NOT gate the
# publish, which lives in ci.yml and completes independently. That is deliberate —
# gating a release on this run was judged not worth it. Revisit if a release ever
# ships a conformance regression.
#
# QT3 is not run here. The XQuery repo runs and gates it with its own runner, so there
# is one QT3 figure from one harness.

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Source dependencies except on the release train (see ci.yml).
  PHOENIXML_DEV: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # ICU-based globalization is required for correct collation and normalize-unicode();
  # invariant mode silently changes conformance results rather than failing loudly.
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 0
  SUITE_DIR: tests/PhoenixmlDb.Conformance.Tests/TestData

jobs:
  conformance:
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '"ubuntu-latest"') }}
    # Measured: run 43012598353 (2026-11-11) took 10 min in all, of which the eleven XSLT
    # chunks were ~2.5 min; setup, build and the suite fetch are the rest. 60 leaves room
    # for a slow or cold runner and still stops a stuck job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Sibling engines from source
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: ./scripts/clone-siblings.sh phoenixmldb-core phoenixmldb-xquery

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # Keyed on the fetch script, which is where the suite revisions are pinned — so
      # bumping a pinned SHA invalidates the cache automatically and no stale suite can
      # survive a deliberate re-baseline.
      - name: Cache W3C suites
        id: suite-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SUITE_DIR }}
          key: w3c-suites-${{ hashFiles('scripts/fetch-conformance-suites.sh') }}

      - name: Fetch W3C suites
        if: steps.suite-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-conformance-suites.sh

      # Without this the run is worse than useless: the fixtures treat a missing suite
      # as "unavailable" and skip, and the job reports 332/332 green in about three
      # seconds having executed nothing. Fail loudly instead.
      - name: Verify suites are present
        run: |
          for s in xslt30-test; do
            if [ ! -e "$SUITE_DIR/$s/catalog.xml" ]; then
              echo "::error::$s missing or incomplete at $SUITE_DIR/$s — refusing to report a green run that tested nothing"
              exit 1
            fi
            echo "$s @ $(git -C "$SUITE_DIR/$s" rev-parse --short HEAD)"
          done

      # One chunk at a time, serially, via the same script used locally — so a CI result
      # and a developer's result are produced the same way and are comparable.
      #
      # This replaced a single unfiltered `dotnet test <project>`, which ran every group
      # in one process and could not report a partial result: one over-long group consumed
      # the run and every other group's result was lost with it. That is how this job
      # burned 47 minutes and reported nothing usable. Chunked, a bad chunk costs its own
      # timeout and the rest still run, still report, and still upload.
      #
      # net10.0 only, which the script hard-codes. The library multi-targets, but
      # conformance is a property of the engine rather than the target framework, and
      # running both doubles an already-long job.
      #
      # The script exits non-zero if ANY chunk fails or times out, so a real regression
      # still turns the job red — but the surviving chunks are reported and uploaded
      # rather than lost.
      - name: Conformance
        env:
          CONFORMANCE_CONFIG: Release
          # Per chunk. The slowest XSLT chunk took 27 s in run 43012598353 and ~8m30s on
          # the slowest runner seen. 15 min leaves headroom and still cuts off a stuck chunk.
          CONFORMANCE_TIMEOUT: '900'
          CONFORMANCE_OUT: ${{ github.workspace }}/conformance-results
        run: ./scripts/conformance.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          # Per-chunk .trx plus the per-chunk logs and the summary table. A chunk that
          # times out leaves the others' results intact, which one combined trx did not.
          path: |
            conformance-results/*.trx
            conformance-results/*.log
            conformance-results/summary.txt
          if-no-files-found: warn
